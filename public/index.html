<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07060c">
<title>Nexus Bank</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#07060c;--s1:#100e1a;--s2:#171329;--ln:#ffffff14;--p:#8b5cf6;--p2:#c4b5fd;--pd:#5b21b6;--tx:#f5f3ff;--mu:#9b94b8;--ok:#34d399;--bad:#fb7185;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--tx);font:15px/1.5 Inter,system-ui,sans-serif;min-height:100vh;overflow-x:hidden;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(600px 400px at 10% -5%,#5b21b655,transparent),radial-gradient(500px 400px at 100% 100%,#3b076466,transparent),radial-gradient(#ffffff0b 1px,transparent 1px) 0 0/22px 22px}
h1,h2,h3,.pop{font-family:Poppins,Inter,sans-serif;letter-spacing:-.02em}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0}
.mu{color:var(--mu)}.pos{color:var(--ok)}.neg{color:var(--bad)}
.fade{animation:up .6s cubic-bezier(.2,.8,.2,1) both}
@keyframes up{from{opacity:0;transform:translateY(16px)}}
.panel{background:linear-gradient(180deg,#ffffff0a,#ffffff03),var(--s1);border:1px solid var(--ln);border-radius:22px;padding:20px;backdrop-filter:blur(14px)}
.btn{width:100%;border-radius:14px;padding:14px;font:600 15px Poppins;color:#fff;background:linear-gradient(135deg,#a78bfa,var(--p) 45%,var(--pd));box-shadow:0 10px 28px -8px #8b5cf6aa,inset 0 1px 0 #fff4;transition:.2s}
.btn:hover{filter:brightness(1.12);transform:translateY(-1px)}.btn:active{transform:scale(.98)}
label{display:grid;gap:6px;font-size:13px;color:var(--mu)}
input{background:#0b0912;border:1px solid var(--ln);color:var(--tx);border-radius:13px;padding:13px 14px;font:16px Inter;outline:none;width:100%;transition:.2s}
input:focus{border-color:var(--p);box-shadow:0 0 0 3px #8b5cf63a}
.err{color:var(--bad);font-size:13px;min-height:19px}
.logo{display:flex;align-items:center;gap:10px;font:700 19px Poppins;letter-spacing:.2em}
.logo svg{width:34px;height:34px}
.login{min-height:100vh;display:grid;grid-template-columns:1fr;align-content:center;gap:28px;max-width:1080px;margin:auto;padding:24px 18px}
.hero h1{font-size:clamp(28px,6vw,46px);line-height:1.1;margin:22px 0 10px}
.hero p{max-width:420px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.chips span{display:flex;gap:6px;align-items:center;font-size:12px;border:1px solid var(--ln);background:#ffffff08;padding:6px 11px;border-radius:99px;color:var(--p2)}
.chips svg{width:14px;height:14px}
.fm{display:grid;gap:16px;max-width:430px;width:100%;justify-self:center}
.seg{display:grid;grid-template-columns:1fr 1fr;background:#0b0912;border-radius:13px;padding:4px}
.seg button{padding:10px;border-radius:10px;font-weight:600;color:var(--mu);transition:.25s}
.seg .on{background:var(--s2);color:var(--tx);box-shadow:0 2px 10px #0008}
@media(min-width:900px){.login{grid-template-columns:1.1fr .9fr;gap:60px}}
.shell{max-width:1120px;margin:auto;display:grid;gap:24px;padding:18px 16px 110px}
.side{display:none}
.ni{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--mu);transition:.2s;padding:6px 10px;border-radius:12px}
.ni.on{color:var(--p2)}
.bnav{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));max-width:440px;margin:auto;display:flex;justify-content:space-around;background:#120f1eea;backdrop-filter:blur(16px);border:1px solid var(--ln);border-radius:24px;padding:8px;z-index:5;box-shadow:0 14px 40px #000a}
@media(min-width:900px){
.shell{grid-template-columns:220px 1fr;padding:34px 24px}
.bnav{display:none}
.side{display:flex;flex-direction:column;gap:6px;position:sticky;top:30px;align-self:start}
.side .logo{margin-bottom:26px}
.side .ni{flex-direction:row;gap:12px;font-size:14px;padding:12px 14px}
.side .ni.on{background:#8b5cf620}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:28px;align-items:start}
}
.hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.av{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font:600 17px Poppins;background:linear-gradient(135deg,var(--p),#1e1b4b);box-shadow:0 0 0 2px #ffffff18}
.amt{font-size:clamp(32px,9vw,42px);font-weight:700;margin:2px 0 6px}
.eye{vertical-align:middle;margin-left:6px;color:var(--mu)}
.eye svg{width:18px;height:18px}
.sub{font-size:13px;color:var(--mu)}.sub b{color:var(--p2)}
.acts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:18px}
.act{display:grid;justify-items:center;gap:6px;padding:14px 4px;border-radius:16px;background:#ffffff08;border:1px solid var(--ln);font-size:13px;transition:.2s}
.act:hover{border-color:var(--p);transform:translateY(-3px);background:#8b5cf61a}
.act svg{color:var(--p2)}
.sec{display:flex;justify-content:space-between;align-items:center;margin:4px 0 12px}
h3{font-size:17px}
.tx,.pr{display:flex;align-items:center;gap:12px;padding:12px;margin-bottom:10px;border-radius:16px;background:var(--s1);border:1px solid var(--ln);animation:up .5s both}
.tx .fl,.pr .fl{flex:1;min-width:0}.tx small,.pr small{display:block;color:var(--mu);font-size:12px}
.ti{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:#8b5cf620;color:var(--p2)}
.bdg{font-size:11px;padding:2px 8px;border-radius:99px;border:1px solid currentColor}
.sm{padding:8px 14px;border-radius:11px;background:#8b5cf626;color:var(--p2);font-weight:600;font-size:13px}
.sm:hover{background:#8b5cf64a}
.kv{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--ln)}
.kv:last-child{border:0}
.kv span:first-child{color:var(--mu)}
.scene{perspective:1000px;margin:20px 0}
.float{animation:fl 6s ease-in-out infinite}
@keyframes fl{50%{transform:translateY(-7px)}}
.cc{--mx:50%;--my:0%;position:relative;aspect-ratio:1.586;max-width:440px;margin:auto;border-radius:22px;padding:6% 7%;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden;transition:transform .18s ease-out,filter .4s;transform-style:preserve-3d;
background:radial-gradient(120% 90% at 100% 0,#6d28d980,transparent 55%),repeating-radial-gradient(circle at 20% 120%,#ffffff08 0 1px,transparent 1px 7px),linear-gradient(135deg,#27242f,#0a0a0f 50%,#1e0f3d);
border:1px solid #ffffff2a;box-shadow:0 30px 70px -20px #7c3aedaa,inset 0 1px 0 #ffffff33}
.cc::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at var(--mx) var(--my),#ffffff30,transparent 42%);pointer-events:none}
.cc::after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 40%,#ffffff22 50%,transparent 60%);transform:translateX(-120%);animation:sh 5s infinite;pointer-events:none}
@keyframes sh{55%,100%{transform:translateX(120%)}}
.cc.frozen{filter:grayscale(1) brightness(.55)}
.cc .row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.mark{display:flex;align-items:center;gap:8px;font:700 clamp(13px,4vw,17px) Poppins;letter-spacing:.24em}
.mark svg{width:28px;height:28px}
.tier{font:600 9px Poppins;letter-spacing:.3em;color:var(--p2);border:1px solid #c4b5fd66;padding:3px 8px;border-radius:5px}
.cmid{display:flex;align-items:center;gap:12px}
.cmid svg{width:24px;height:24px;color:#ddd6fe;opacity:.8}
.chip{width:46px;height:35px;border-radius:7px;background:linear-gradient(135deg,#f3e8ff,#a78bfa 45%,#6d28d9);position:relative}
.chip::after{content:"";position:absolute;inset:6px 10px;border:1px solid #0005;border-radius:3px}
.num{font:500 clamp(15px,4.8vw,22px) "JetBrains Mono",Menlo,monospace;letter-spacing:.12em;text-shadow:0 2px 2px #000a,0 -1px 0 #fff3}
.cc small{display:block;font-size:8px;letter-spacing:.14em;color:#c4b5fd;opacity:.85}
.cc b{font:600 12px Poppins;letter-spacing:.1em}
.cn{font:600 clamp(11px,3.4vw,15px) Poppins;letter-spacing:.14em;text-transform:uppercase}
.cdt{display:flex;gap:18px}
.ov{position:fixed;inset:0;background:#000b;backdrop-filter:blur(6px);display:grid;align-items:end;z-index:20;animation:fo .25s}
@keyframes fo{from{opacity:0}}
.sheet{background:var(--s1);border:1px solid var(--ln);border-radius:26px 26px 0 0;padding:22px;display:grid;gap:14px;max-width:480px;width:100%;margin:auto;animation:up .35s both;padding-bottom:calc(22px + env(safe-area-inset-bottom,0px))}
.sh{display:flex;justify-content:space-between;align-items:center}
@media(min-width:700px){.ov{align-items:center}.sheet{border-radius:26px}}
#toast{position:fixed;top:calc(16px + env(safe-area-inset-top,0px));left:50%;transform:translate(-50%,-100px);background:var(--p);color:#fff;padding:12px 18px;border-radius:14px;font-weight:600;transition:.4s;z-index:50;max-width:90vw;box-shadow:0 10px 30px #0008}
#toast.on{transform:translate(-50%,0)}#toast.bad{background:#be123c}
.adm{max-width:1060px;margin:auto;padding:20px 16px 40px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:20px 0}
.st b{display:block;font:700 24px Poppins}
.tw{overflow-x:auto;padding:0}
table{width:100%;border-collapse:collapse;min-width:820px}
th,td{padding:13px 14px;text-align:left;font-size:14px;border-bottom:1px solid var(--ln);white-space:nowrap}
th{color:var(--mu);font-size:11px;text-transform:uppercase;letter-spacing:.08em}
tr:last-child td{border:0}
td input{width:96px;padding:8px 10px;font-size:14px}
.ip{font-family:"JetBrains Mono",monospace;color:var(--p2);font-size:13px}
.ab{border-radius:10px;padding:8px 12px;font-weight:700;color:#fff}
.ab.a{background:#059669}.ab.r{background:#be123c}
.u{display:flex;align-items:center;gap:10px}.u .av{width:34px;height:34px;font-size:14px}
.mid{max-width:520px;margin:auto;display:grid;gap:14px}
.ctr{text-align:center;display:grid;gap:6px;justify-items:center}
.okc{width:68px;height:68px;border-radius:50%;display:grid;place-items:center;background:#34d39922;color:var(--ok);animation:pop .6s cubic-bezier(.2,1.4,.4,1) both}
@keyframes pop{from{transform:scale(0)}}
.okc svg{width:34px;height:34px;stroke-width:2.4}
.ghost{background:#ffffff0c!important;box-shadow:none!important;border:1px solid var(--ln)}
.rec{display:flex;gap:14px;overflow-x:auto;padding:4px 2px}
.rc{display:grid;justify-items:center;gap:5px;font-size:12px;color:var(--mu)}
.big{font:700 28px Poppins!important}
.lk{font-size:13px;min-height:19px}
.qa{display:flex;gap:8px;flex-wrap:wrap}
.qa button{padding:7px 14px;border-radius:99px;border:1px solid var(--ln);background:#ffffff08;font-size:13px;color:var(--p2)}
.mg{display:block;font-size:12px;color:var(--p2);font-style:italic}
.aviso{display:flex;gap:8px;align-items:flex-start;font-size:12px;line-height:1.45;color:#fcd34d;background:#fbbf2414;border:1px solid #fbbf2433;border-radius:12px;padding:10px 12px}
.aviso svg{margin-top:1px}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast"></div>
<script>
const P={
home:'<path d="M3 11l9-8 9 8v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/>',
trend:'<path d="M3 17l6-6 4 4 8-8"/><path d="M15 7h6v6"/>',
card:'<rect x="2" y="5" width="20" height="14" rx="3"/><path d="M2 10h20"/>',
user:'<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/>',
send:'<path d="M7 17L17 7M8 7h9v9"/>',
down:'<path d="M17 7L7 17M16 17H7V8"/>',
plus:'<path d="M12 5v14M5 12h14"/>',
eye:'<path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>',
eyeoff:'<path d="M3 3l18 18M10.6 6.1A9.8 9.8 0 0 1 12 5c6 0 10 7 10 7a17 17 0 0 1-3.2 3.9M6.5 6.6C3.8 8.4 2 12 2 12s4 7 10 7c1.6 0 3-.4 4.3-1M9.9 9.9a3 3 0 0 0 4.2 4.2"/>',
logout:'<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/>',
shield:'<path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/>',
lock:'<rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/>',
copy:'<rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/>',
nfc:'<path d="M8 8c2.5 2.5 2.5 5.5 0 8M12 5c4.5 4 4.5 10 0 14M16 2c6 5.5 6 14.5 0 20"/>',
wallet:'<path d="M3 7a2 2 0 0 1 2-2h13v4"/><rect x="3" y="7" width="18" height="13" rx="3"/><circle cx="16.5" cy="13.5" r="1"/>',
users:'<circle cx="9" cy="8" r="3.5"/><path d="M2 20c0-3.5 3-5.5 7-5.5s7 2 7 5.5M17 4.5a3.5 3.5 0 0 1 0 7M22 20c0-2.5-1.5-4-4-5"/>',
x:'<path d="M6 6l12 12M18 6L6 18"/>',
bank:'<path d="M3 10l9-6 9 6M5 10v8M9 10v8M15 10v8M19 10v8M3 21h18"/>'};
const ic=(n,s)=>`<svg class="i" viewBox="0 0 24 24"${s?` style="width:${s}px;height:${s}px"`:''}>${P[n]}</svg>`;
const logoSvg=`<svg viewBox="0 0 32 32"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#c4b5fd"/><stop offset=".5" stop-color="#8b5cf6"/><stop offset="1" stop-color="#4c1d95"/></linearGradient></defs><rect width="32" height="32" rx="10" fill="url(#lg)"/><path d="M9.5 23V9.5L22.5 22.5V9" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>`;

P.check='<path d="M5 12l5 5L20 7"/>';
async function api(m,p,b){let r,d={};try{r=await fetch('/api/'+p,{method:m,headers:{'Content-Type':'application/json'},body:b?JSON.stringify(b):undefined,credentials:'same-origin'})}catch(e){throw new Error('Sem conexão com o servidor.')}
try{d=await r.json()}catch(e){}if(!r.ok)throw new Error(d.error||'Erro inesperado.');return d}
const R2=n=>Math.round(n*100)/100;
const brl=v=>v.toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const fd=s=>new Date(s).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const parse=v=>{v=String(v).trim();const x=v.includes(',')?parseFloat(v.replace(/\./g,'').replace(',','.')):parseFloat(v);return x>0?R2(x):0};

const $=s=>document.querySelector(s),app=$('#app'),SPEED=3;
const S={me:null,tab:'home',hide:false,mode:'login',tick:null,adm:[],pix:{step:'form',to:'',a:'',msg:'',rec:null}};
const nm=u=>u[0].toUpperCase()+u.slice(1);
const TI={in:'down',out:'send',inv:'trend',bonus:'plus',adm:'shield'};
const NAV=[['home','Início','home'],['pix','Pix','send'],['invest','Investir','trend'],['card','Cartão','card'],['acc','Conta','user']];
const prod=id=>S.me.products.find(p=>p.id===id);
function invValue(i){const p=prod(i.p),d=(Date.now()-i.t)/1000*SPEED;return i.a*Math.pow(1+p.r,d/365)*(1+p.v*(Math.sin(d/6+i.s)-Math.sin(i.s)))}
const totalInv=u=>u.inv.reduce((s,i)=>s+invValue(i),0);
function toast(m,bad){const t=$('#toast');t.textContent=m;t.className='on'+(bad?' bad':'');clearTimeout(t.h);t.h=setTimeout(()=>t.className='',2800)}
const go=async f=>{try{await f()}catch(e){toast(e.message,1)}};
async function load(){try{S.me=await api('GET','me')}catch(e){S.me=null}}
async function enter(){await load();if(S.me&&S.me.role==='admin')S.adm=(await api('GET','admin/users')).users;render()}
function count(el,to,ms=1000){const t0=performance.now();(function f(t){const k=Math.min(1,(t-t0)/ms);el.textContent=S.hide?'R$ ••••••':brl(to*(1-Math.pow(1-k,4)));if(k<1)requestAnimationFrame(f)})(t0)}
const fmtCard=c=>c.slice(0,4)+' '+c.slice(4,10)+' '+c.slice(10);
function cardH(u,name){return `<div class="scene"><div class="float"><div class="cc${u.frozen?' frozen':''}">
<div class="row"><div class="mark">${logoSvg}NEXUS</div><div class="tier">BLACK</div></div>
<div class="cmid"><div class="chip"></div>${ic('nfc')}</div><div class="num">${fmtCard(u.card)}</div>
<div class="row"><div class="cn">${name}</div><div class="cdt"><div><small>MEMBRO DESDE</small><b>${u.since}</b></div><div><small>VÁLIDO ATÉ</small><b>${u.exp}</b></div></div></div></div></div></div>`}
function txH(u,n=10,pixOnly){return u.tx.filter(t=>!pixOnly||t.peer).slice(0,n).map((t,i)=>`<div class="tx" style="animation-delay:${i*.05}s"><div class="ti">${ic(TI[t.k]||'wallet')}</div><div class="fl"><b>${esc(t.t)}</b><small>${fd(t.d)}</small>${t.msg?`<span class="mg">“${esc(t.msg)}”</span>`:''}</div><b class="${t.v<0?'neg':'pos'}">${t.v<0?'−':'+'}${brl(Math.abs(t.v))}</b></div>`).join('')||'<p class="mu">Nada por aqui ainda.</p>'}
const head=t=>`<header class="hd"><div><p class="mu">${t}</p><h2>${nm(S.me.name)}</h2></div><div class="av">${S.me.name[0].toUpperCase()}</div></header>`;
function pixV(u){const p=S.pix,r=p.rec;
if(p.step==='done')return `${head('Pix,')}<div class="mid"><div class="panel ctr"><div class="okc">${ic('check')}</div><h2>Pix enviado!</h2><div class="amt pop">${brl(r.amount)}</div><p class="mu">para @${r.to}</p></div>
<div class="panel"><div class="kv"><span>Protocolo</span><b>${r.id}</b></div><div class="kv"><span>Data</span><b>${fd(r.date)}</b></div><div class="kv"><span>Destino</span><b>@${r.to}</b></div>${r.msg?`<div class="kv"><span>Mensagem</span><b>${esc(r.msg)}</b></div>`:''}<div class="kv"><span>Novo saldo</span><b>${brl(r.bal)}</b></div></div>
<button class="btn" data-a="pixnew">Nova transferência</button><button class="btn ghost" data-a="pixcopy">Copiar comprovante</button></div>`;
if(p.step==='review')return `${head('Pix,')}<div class="mid"><form class="panel" id="cf" style="display:grid;gap:12px"><h3>Confirme os dados</h3><div><div class="kv"><span>Para</span><b>@${p.to}</b></div><div class="kv"><span>Valor</span><b>${brl(p.v)}</b></div>${p.msg?`<div class="kv"><span>Mensagem</span><b>${esc(p.msg)}</b></div>`:''}<div class="kv"><span>Tarifa</span><b class="pos">Grátis</b></div><div class="kv"><span>Saldo após</span><b>${brl(u.bal-p.v)}</b></div></div>
<label>Senha para confirmar<input id="pw" type="password" autocomplete="current-password" required></label><div class="err" id="e"></div><button class="btn">Confirmar transferência</button><button type="button" class="btn ghost" data-a="pixback">Voltar</button></form></div>`;
const rc=[...new Set(u.tx.filter(t=>t.k==='out'&&t.peer).map(t=>t.peer))].slice(0,6);
return `${head('Pix,')}<div class="cols"><section><form class="panel" id="pf" style="display:grid;gap:14px"><div><div class="mu">Saldo disponível</div><div class="pop" style="font-size:24px;font-weight:700">${brl(u.bal)}</div></div>
${rc.length?`<div><div class="mu" style="font-size:13px;margin-bottom:6px">Recentes</div><div class="rec">${rc.map(x=>`<button type="button" class="rc" data-a="pick" data-k="${x}"><div class="av">${x[0].toUpperCase()}</div>@${x}</button>`).join('')}</div></div>`:''}
<label>Para (usuário)<input id="to" value="${p.to}" autocapitalize="none" autocomplete="off" required placeholder="@usuario"></label><div class="lk" id="lk"></div>
<label>Valor<input id="amt" class="big" value="${p.a}" inputmode="decimal" required placeholder="0,00"></label>
<div class="qa"><button type="button" data-a="chip" data-k="10">R$ 10</button><button type="button" data-a="chip" data-k="50">R$ 50</button><button type="button" data-a="chip" data-k="100">R$ 100</button><button type="button" data-a="chip" data-k="${u.bal}">Tudo</button></div>
<label>Mensagem (opcional)<input id="msg" value="${esc(p.msg)}" maxlength="60" placeholder="Ex: almoço de ontem"></label><div class="err" id="e"></div><button class="btn">Continuar</button></form></section>
<section><div class="sec"><h3>Últimos Pix</h3></div>${txH(u,8,1)}</section></div>`}
const TABS={
home:u=>`${head('Olá,')}<div class="cols"><section><div class="panel"><div class="mu">Saldo disponível<button class="eye" data-a="eye" aria-label="Ocultar saldo">${ic(S.hide?'eyeoff':'eye')}</button></div><div class="amt pop" id="bal"></div><div class="sub">Investido <b>${brl(totalInv(u))}</b></div>
<div class="acts"><button class="act" data-a="tab" data-k="pix">${ic('send')}Transferir</button><button class="act" data-a="tab" data-k="invest">${ic('trend')}Investir</button><button class="act" data-a="recv">${ic('down')}Receber</button></div></div>${cardH(u,S.me.name)}</section>
<section><div class="sec"><h3>Movimentações</h3></div>${txH(u)}</section></div>`,
pix:pixV,
invest:u=>`${head('Seus investimentos,')}<div class="cols"><section><div class="panel"><div class="mu">Valor atual aplicado</div><div class="amt pop" id="icur"></div><div class="sub">Rendimento <b id="ipl"></b></div></div>
<div class="sec" style="margin-top:20px"><h3>Posições</h3></div>${u.inv.length?u.inv.map(i=>`<div class="pr"><div class="ti">${ic('trend')}</div><div class="fl"><b>${prod(i.p).n}</b><small>Aplicado ${brl(i.a)} · <span id="p-${i.id}"></span></small></div><div style="text-align:right"><b id="v-${i.id}"></b><br><button class="sm" data-a="redeem" data-k="${i.id}">Resgatar</button></div></div>`).join(''):'<p class="mu">Você ainda não possui aplicações.</p>'}</section>
<section><div class="sec"><h3>Produtos</h3><span class="mu">Disponível ${brl(u.bal)}</span></div>${S.me.products.map(p=>`<div class="pr"><div class="ti" style="color:${p.c}">${ic('bank')}</div><div class="fl"><b>${p.n}</b><small>${(p.r*100).toFixed(1)}% a.a. · <span class="bdg" style="color:${p.c}">Risco ${p.risk}</span></small></div><button class="sm" data-a="inv" data-k="${p.id}">Investir</button></div>`).join('')}</section></div>`,
card:u=>`${head('Seu cartão,')}<div class="mid">${cardH(u,S.me.name)}<div class="panel"><div class="kv"><span>Número</span><span>${fmtCard(u.card)} <button data-a="copy" data-k="${u.card}" style="color:var(--p2);vertical-align:middle">${ic('copy',16)}</button></span></div>
<div class="kv"><span>CVV</span><span>${S.cvv?u.cvv:'••••'} <button data-a="cvv" style="color:var(--p2);vertical-align:middle">${ic(S.cvv?'eyeoff':'eye',16)}</button></span></div><div class="kv"><span>Validade</span><span>${u.exp}</span></div><div class="kv"><span>Limite</span><span>${brl(5000)}</span></div></div>
<button class="btn" data-a="freeze">${u.frozen?'Desbloquear cartão':'Bloquear cartão'}</button></div>`,
acc:u=>`${head('Sua conta,')}<div class="mid"><div class="panel"><div class="kv"><span>Usuário</span><span>@${S.me.name}</span></div><div class="kv"><span>Agência</span><span>0001</span></div><div class="kv"><span>Conta</span><span>${u.acc}</span></div><div class="kv"><span>Chave Pix</span><span>@${S.me.name}</span></div><div class="kv"><span>Cliente desde</span><span>${new Date(u.created).toLocaleDateString('pt-BR')}</span></div></div>
<button class="btn" style="background:#be123c" data-a="out">Sair da conta</button></div>`};
function loginV(){const reg=S.mode==='reg';
app.innerHTML=`<div class="login"><section class="hero fade"><div class="logo">${logoSvg}NEXUS</div><h1>O banco que acompanha o seu ritmo.</h1><p class="mu">Cartão Black, investimentos e Pix em um só lugar.</p>
<div class="chips"><span>${ic('shield')}Seguro</span><span>${ic('trend')}Investimentos</span><span>${ic('card')}Cartão Black</span></div>${cardH({card:'378282246310005',exp:'12/31',since:2026},'Nexus Member')}</section>
<form class="panel fm fade" id="f" style="animation-delay:.15s"><div class="seg"><button type="button" data-a="mode" data-k="login" class="${reg?'':'on'}">Entrar</button><button type="button" data-a="mode" data-k="reg" class="${reg?'on':''}">Criar conta</button></div>
<label>Usuário<input id="u" autocomplete="username" autocapitalize="none" required placeholder="seu.usuario"></label><label>Senha<input id="p" type="password" autocomplete="${reg?'new':'current'}-password" required placeholder="••••••"></label><div class="err" id="e"></div><button class="btn">${reg?'Abrir minha conta':'Entrar'}</button><div class="aviso">${ic('shield',16)}<span>Banco de demonstração: todo o dinheiro é <b>fictício</b>. Não use senhas reais.</span></div></form></div>`;
$('#f').onsubmit=async e=>{e.preventDefault();try{const r=await api('POST',reg?'register':'login',{user:$('#u').value,pass:$('#p').value});S.tab='home';S.hide=false;await enter();if(r.isNew)toast('Conta criada! R$ 100,00 de boas-vindas')}catch(x){$('#e').textContent=x.message}};tilt()}
function shellV(){const u=S.me.u;
const nav=NAV.map(([k,l,i])=>`<button class="ni ${S.tab===k?'on':''}" data-a="tab" data-k="${k}">${ic(i)}<span>${l}</span></button>`).join('');
app.innerHTML=`<div class="shell"><aside class="side"><div class="logo">${logoSvg}NEXUS</div>${nav}<button class="ni" data-a="out">${ic('logout')}<span>Sair</span></button></aside><main class="fade">${TABS[S.tab](u)}</main><nav class="bnav">${nav}</nav></div>`;
tilt();const b=$('#bal');if(b)count(b,u.bal);if(S.tab==='invest'){live();S.tick=setInterval(live,1000)}if(S.tab==='pix')bindPix()}
function bindPix(){const p=S.pix;let t;
if($('#to')){const chk=()=>{const v=$('#to').value.trim().toLowerCase().replace(/^@/,'');p.to=v;p.ok=0;const l=$('#lk');if(v.length<3){l.textContent='';return}
clearTimeout(t);t=setTimeout(async()=>{try{await api('POST','lookup',{u:v});if($('#to')&&p.to===v){p.ok=1;l.innerHTML='<span class="pos">✓ @'+esc(v)+' encontrado</span>'}}catch(e){if(p.to===v)l.innerHTML='<span class="neg">'+esc(e.message)+'</span>'}},350)};
$('#to').oninput=chk;if(p.to)chk();$('#amt').oninput=e=>p.a=e.target.value;$('#msg').oninput=e=>p.msg=e.target.value;
$('#pf').onsubmit=async e=>{e.preventDefault();const v=parse(p.a),u=S.me.u;p.to=$('#to').value.trim().toLowerCase().replace(/^@/,'');
try{if(!(v>=.01))throw Error('Informe um valor válido.');if(v>u.bal)throw Error('Saldo insuficiente.');if(v>5000)throw Error('Limite por transferência: R$ 5.000,00.');
await api('POST','lookup',{u:p.to});p.v=v;p.step='review';render()}catch(x){$('#e').textContent=x.message}}}
if($('#cf'))$('#cf').onsubmit=async e=>{e.preventDefault();try{p.rec=await api('POST','transfer',{to:p.to,amount:p.v,msg:p.msg,password:$('#pw').value});p.step='done';await load();render()}catch(x){$('#e').textContent=x.message}}}
function live(){const u=S.me&&S.me.u;if(!u||!$('#icur'))return;let c=0,a=0;
u.inv.forEach(i=>{const v=invValue(i);c+=v;a+=i.a;const e=$('#v-'+i.id);if(e){e.textContent=brl(v);e.className=v>=i.a?'pos':'neg';$('#p-'+i.id).textContent=((v/i.a-1)*100).toFixed(2)+'%'}});
$('#icur').textContent=brl(c);const d=c-a;$('#ipl').textContent=(d>=0?'+':'')+brl(d)}
function tilt(){document.querySelectorAll('.cc').forEach(c=>{const mv=e=>{const r=c.getBoundingClientRect(),x=(e.clientX-r.left)/r.width,y=(e.clientY-r.top)/r.height;c.style.transform=`rotateY(${(x-.5)*26}deg) rotateX(${(.5-y)*26}deg)`;c.style.setProperty('--mx',x*100+'%');c.style.setProperty('--my',y*100+'%')};
c.onpointermove=mv;c.onpointerdown=mv;c.onpointerleave=c.onpointerup=()=>{c.style.transform='';c.style.setProperty('--my','0%')}})}
function rowsH(q){return S.adm.filter(o=>o.user.includes(q)).map(o=>`<tr><td><div class="u"><div class="av">${o.user[0].toUpperCase()}</div><div><b>${nm(o.user)}</b><br><small class="mu">@${o.user}</small></div></div></td><td class="ip">${esc(o.ip)}</td><td>${fd(o.last)}</td><td><b>${brl(o.bal)}</b></td><td>${brl(o.inv)}</td><td><input id="a-${o.user}" inputmode="decimal" placeholder="Valor"> <button class="ab a" data-a="adj" data-k="${o.user}" data-s="1">+</button> <button class="ab r" data-a="adj" data-k="${o.user}" data-s="-1">−</button></td></tr>`).join('')||'<tr><td colspan="6" class="mu">Nenhum usuário encontrado.</td></tr>'}
function adminV(){const us=S.adm;
app.innerHTML=`<div class="adm fade"><div class="hd"><div class="logo">${logoSvg}NEXUS <span class="mu" style="font:500 13px Inter;letter-spacing:0">Admin</span></div><button class="sm" data-a="out">Sair</button></div>
<div class="stats"><div class="panel st"><span class="mu">Usuários</span><b>${us.length}</b></div><div class="panel st"><span class="mu">Saldo em contas</span><b>${brl(us.reduce((s,o)=>s+o.bal,0))}</b></div><div class="panel st"><span class="mu">Total investido</span><b>${brl(us.reduce((s,o)=>s+o.inv,0))}</b></div><div class="panel st"><span class="mu">IPs únicos</span><b>${new Set(us.map(o=>o.ip)).size}</b></div></div>
<div class="sec"><h3>Usuários</h3><input id="q" placeholder="Buscar usuário" style="max-width:220px"></div><div class="panel tw"><table><thead><tr><th>Usuário</th><th>IP</th><th>Último acesso</th><th>Saldo</th><th>Investido</th><th>Ajustar saldo</th></tr></thead><tbody id="tb">${rowsH('')}</tbody></table></div></div>`;
$('#q').oninput=e=>$('#tb').innerHTML=rowsH(e.target.value.toLowerCase())}
function modal(t,body,ok,label='Confirmar'){const o=document.createElement('div');o.className='ov';
o.innerHTML=`<form class="sheet"><div class="sh"><h3>${t}</h3><button type="button" data-c>${ic('x')}</button></div>${body}<div class="err"></div>${ok?`<button class="btn">${label}</button>`:''}</form>`;
document.body.appendChild(o);o.onclick=e=>{if(e.target===o||e.target.closest('[data-c]'))o.remove()};
o.querySelector('form').onsubmit=async e=>{e.preventDefault();try{ok&&await ok(new FormData(e.target));o.remove()}catch(x){o.querySelector('.err').textContent=x.message}};
const f=o.querySelector('input');if(f)f.focus()}
const ACT={
tab:b=>{S.tab=b.dataset.k;render();scrollTo(0,0)},
mode:b=>{S.mode=b.dataset.k;render()},
out:()=>go(async()=>{await api('POST','logout');S.me=null;S.pix={step:'form',to:'',a:'',msg:'',rec:null};render()}),
eye:()=>{S.hide=!S.hide;render()},cvv:()=>{S.cvv=!S.cvv;render()},
freeze:()=>go(async()=>{const r=await api('POST','freeze');await load();render();toast(r.frozen?'Cartão bloqueado':'Cartão desbloqueado')}),
copy:b=>{try{navigator.clipboard.writeText(b.dataset.k)}catch(e){}toast('Copiado!')},
pick:b=>{S.pix.to=b.dataset.k;render()},
chip:b=>{S.pix.a=String(b.dataset.k).replace('.',',');render()},
pixnew:()=>{S.pix={step:'form',to:'',a:'',msg:'',rec:null};render()},
pixback:()=>{S.pix.step='form';render()},
pixcopy:()=>{const r=S.pix.rec;try{navigator.clipboard.writeText(`Nexus Bank - Comprovante Pix\nProtocolo: ${r.id}\nValor: ${brl(r.amount)}\nPara: @${r.to}\nData: ${fd(r.date)}`)}catch(e){}toast('Comprovante copiado!')},
recv:()=>modal('Receber','<p class="mu">Compartilhe sua chave Pix para receber transferências.</p><div class="panel"><div class="kv"><span>Chave Pix</span><b>@'+S.me.name+'</b></div><div class="kv"><span>Agência / Conta</span><b>0001 / '+S.me.u.acc+'</b></div></div><button type="button" class="btn" data-a="copy" data-k="@'+S.me.name+'">Copiar chave</button>'),
inv:b=>{const p=prod(b.dataset.k);modal(p.n,`<p class="mu">${(p.r*100).toFixed(1)}% a.a. · Risco ${p.risk} · Disponível ${brl(S.me.u.bal)}</p><label>Valor a investir<input name="a" required inputmode="decimal" placeholder="0,00"></label>`,async f=>{await api('POST','invest',{product:p.id,amount:parse(f.get('a'))});await load();render();toast('Aplicação realizada!')},'Investir')},
redeem:b=>go(async()=>{const r=await api('POST','redeem',{id:b.dataset.k});await load();render();toast('Resgatado '+brl(r.value))}),
adj:b=>go(async()=>{const k=b.dataset.k,s=+b.dataset.s,a=parse($('#a-'+k).value);await api('POST','admin/adjust',{user:k,amount:a,sign:s});S.adm=(await api('GET','admin/users')).users;render();toast((s>0?'Adicionado ':'Retirado ')+brl(a))})};
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(b)ACT[b.dataset.a](b)});
function render(){clearInterval(S.tick);if(!S.me)return loginV();S.me.role==='admin'?adminV():shellV()}
setInterval(async()=>{if(document.hidden||!S.me||S.me.role!=='user'||document.querySelector('.ov'))return;try{const p=await api('GET','ping'),old=S.me.u.tx[0]&&S.me.u.tx[0].id;if(p.tx===old)return;await load();if(!S.me||S.me.role!=='user')return;const n=S.me.u.tx[0];if(n&&n.k==='in')toast('Você recebeu '+brl(n.v)+' de @'+n.peer);if(S.tab!=='pix'||S.pix.step==='done')render()}catch(e){}},15000);
enter();
</script>
</body>
</html>
